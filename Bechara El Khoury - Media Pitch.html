document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <li class=\"hl-row\">\n            <span class=\"hl-ico\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"6\" width=\"13\" height=\"12\" rx=\"1.5\"><\u002Frect><path d=\"M16 10l5-3v10l-5-3z\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n            <div><div class=\"hl-title\">28 shoots directed &amp; shot<\u002Fdiv><div class=\"hl-desc\">Lead director and cinematographer on every shoot — multiple camera formats and crew.<\u002Fdiv><\u002Fdiv>\n          <\u002Fli>\n          <li class=\"hl-row\">\n            <span class=\"hl-ico\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 5v14M4 5h13l-2.5 3.5L17 12H4\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n            <div><div class=\"hl-title\">70+ edits supervised to delivery<\u002Fdiv><div class=\"hl-desc\">Color grade, VO, sound and music — reviewed through Frame.io to final cut.<\u002Fdiv><\u002Fdiv>\n          <\u002Fli>\n          <li class=\"hl-row\">\n            <span class=\"hl-ico\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M3 12h18M12 3c2.5 2.5 2.5 15 0 18M12 3c-2.5 2.5-2.5 15 0 18\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n            <div><div class=\"hl-title\">12+ content worlds covered<\u002Fdiv><div class=\"hl-desc\">Cars, yachts, desert, water, rallies, events, hospitality, brand and podcast.<\u002Fdiv><\u002Fdiv>\n          <\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ROLE -->\n<section id=\"role\">\n  <div class=\"wrap\">\n    <div class=\"sec-head reveal\">\n      <p class=\"eyebrow\">The Role<\u002Fp>\n      <h2 class=\"sec-title\">Not one job.<br><span class=\"gold\">Six in parallel.<\u002Fspan><\u002Fh2>\n      <p class=\"sec-intro\">The Head of Media role at Beno covered the full creative and operational stack simultaneously · from concept to camera to cut to delivery. Every production was touched at every stage.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"roles-grid reveal\">\n      <div class=\"role-card\">\n        <div class=\"role-num\">01 / CREATIVE<\u002Fdiv>\n        <div class=\"role-title\">Head of Media &amp; Creative Director<\u002Fdiv>\n        <div class=\"role-desc\">Set the creative direction for all productions. Defined visual language, storytelling approach, and brand aesthetic across every content category. Built the editorial framework that unified all output under a coherent identity.<\u002Fdiv>\n        <div class=\"role-tags\"><span class=\"rtag\">Visual Identity<\u002Fspan><span class=\"rtag\">Art Direction<\u002Fspan><span class=\"rtag\">Creative Briefs<\u002Fspan><span class=\"rtag\">OKR / Scoreboard<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"role-card\">\n        <div class=\"role-num\">02 / PRODUCTION<\u002Fdiv>\n        <div class=\"role-title\">Director &amp; Cinematographer<\u002Fdiv>\n        <div class=\"role-desc\">Led all 28 shoots · from night desert shoots starting at 7AM to multi-day rally productions in Fujairah. Operated cinema line cameras, directed talent, controlled lighting design, and supervised every frame that went to post.<\u002Fdiv>\n        <div class=\"role-tags\"><span class=\"rtag\">Cinema Cameras<\u002Fspan><span class=\"rtag\">Gimbal · Insta360<\u002Fspan><span class=\"rtag\">Lighting Design<\u002Fspan><span class=\"rtag\">On-Set Direction<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"role-card\">\n        <div class=\"role-num\">03 / LEADERSHIP<\u002Fdiv>\n        <div class=\"role-title\">Team Builder &amp; Department Architect<\u002Fdiv>\n        <div class=\"role-desc\">Founded the department structure from zero. Hired and onboarded 3 editors and 2 videographers. Built all operating systems: brief intake, review hierarchy, equipment protocols, performance tracking. Grew the team from 1 to 7 at peak.<\u002Fdiv>\n        <div class=\"role-tags\"><span class=\"rtag\">Hiring &amp; Screening<\u002Fspan><span class=\"rtag\">Team Training<\u002Fspan><span class=\"rtag\">Dept Architecture<\u002Fspan><span class=\"rtag\">Performance KPIs<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"role-card\">\n        <div class=\"role-num\">04 / POST-PRODUCTION<\u002Fdiv>\n        <div class=\"role-title\">Color Grade · Sound · Supervision<\u002Fdiv>\n        <div class=\"role-desc\">Supervised all editorial output across 70+ video edits. Personally applied LUT color grading on flagship productions (VVR Campaign). Directed sound design, VO recording, music selection. Every edit passed through creative review before delivery.<\u002Fdiv>\n        <div class=\"role-tags\"><span class=\"rtag\">LUT Grading<\u002Fspan><span class=\"rtag\">VO Direction<\u002Fspan><span class=\"rtag\">Frame.io Review<\u002Fspan><span class=\"rtag\">Sound Design<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"role-card\">\n        <div class=\"role-num\">05 / STRATEGY<\u002Fdiv>\n        <div class=\"role-title\">Producer &amp; Content Strategist<\u002Fdiv>\n        <div class=\"role-desc\">Designed 3-phase department roadmap (Foundation → Scale → Full Capability). Built content strategies adapted to seasonal moments, brand priorities, and platform demands. Managed stakeholder communication, budgets, equipment procurement, and cross-functional collaboration.<\u002Fdiv>\n        <div class=\"role-tags\"><span class=\"rtag\">Phase Planning<\u002Fspan><span class=\"rtag\">Scheduling<\u002Fspan><span class=\"rtag\">Budget Planning<\u002Fspan><span class=\"rtag\">Stakeholder Mgmt<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"role-card\">\n        <div class=\"role-num\">06 / INNOVATION<\u002Fdiv>\n        <div class=\"role-title\">AI Integration &amp; Display Systems<\u002Fdiv>\n        <div class=\"role-desc\">Integrated AI-generated content (AI Christmas video, Dec 2025). Planned AI tool pipeline for production efficiency. Used AutoCut for podcast multi-cam editing workflow.<\u002Fdiv>\n        <div class=\"role-tags\"><span class=\"rtag\">AI Content<\u002Fspan><span class=\"rtag\">Custom Display<\u002Fspan><span class=\"rtag\">Multi-cam Setup<\u002Fspan><span class=\"rtag\">Tool Pipeline<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- DOMAINS -->\n<section id=\"domains\">\n  <div class=\"wrap\">\n    <div class=\"sec-head reveal\">\n      <p class=\"eyebrow\">Content Domains<\u002Fp>\n      <h2 class=\"sec-title\">One department.<br><span class=\"gold\">Every world.<\u002Fspan><\u002Fh2>\n      <p class=\"sec-intro\">Beno's business spans the full luxury lifestyle spectrum. The media department covered every vertical · from hypercar shoots at night to watersports action, from intimate yacht events to multi-day desert rallies. No two productions were the same.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"domains-grid reveal\">\n      <div class=\"domain-card\">\n        <div class=\"icon-chip\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 13.5l1.7-4.6A2.5 2.5 0 0 1 7 7.2h10a2.5 2.5 0 0 1 2.3 1.7l1.7 4.6\"><\u002Fpath><path d=\"M3 13.5h18v3.5a1 1 0 0 1-1 1h-1.5a1 1 0 0 1-1-1v-1H6.5v1a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z\"><\u002Fpath><path d=\"M7 15.5h2M15 15.5h2\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <div class=\"domain-name\">Luxury Cars<\u002Fdiv>\n        <div class=\"domain-desc\">Asset films, social reels, night shoots, multi-car campaigns. Hypercars, SUVs, sports cars. Shot across roads, rallies, desert, and mountains.<\u002Fdiv>\n        <div class=\"domain-count-badge\">15+ productions<\u002Fdiv>\n      <\u002Fdiv>\n      <d title\">Instagram · Beno<\u002Fdiv><div class=\"reel-sub\">Selected work<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"reel-card\">\n      <div class=\"reel-embed-box\"><iframe class=\"reel-embed\" src=\"https://www.instagram.com/reel/DZ0Er6DDzfB/embed/\" loading=\"lazy\" scrolling=\"no\" allowtransparency=\"true\" allow=\"encrypted-media\"><\u002Fiframe><\u002Fdiv>\n      <div class=\"reel-meta\"><div class=\"reel-num\">REEL 08<\u002Fdiv><div class=\"reel-title\">Instagram · Beno<\u002Fdiv><div class=\"reel-sub\">Selected work<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"reel-card\">\n      <div class=\"reel-embed-box\"><iframe class=\"reel-embed\" src=\"https://www.instagram.com/reel/DSUMyWogj4i/embed/\" loading=\"lazy\" scrolling=\"no\" allowtransparency=\"true\" allow=\"encrypted-media\"><\u002Fiframe><\u002Fdiv>\n      <div class=\"reel-meta\"><div class=\"reel-num\">REEL 09<\u002Fdiv><div class=\"reel-title\">Instagram · Beno<\u002Fdiv><div class=\"reel-sub\">Selected work<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- PRODUCTIONS -->\n<section id=\"productions\">\n  <div class=\"wrap\">\n    <div class=\"sec-head reveal\">\n      <p class=\"eyebrow\">Production Approach<\u002Fp>\n      <h2 class=\"sec-title\">How the work<br><span class=\"gold\">gets done.<\u002Fspan><\u002Fh2>\n      <p class=\"sec-intro\">A cross-section of production types — each with its own creative, logistical, and directorial demands. What stays constant is full ownership, concept to delivery.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"proj-grid reveal\">\n      <div class=\"proj-card\">\n        <div class=\"proj-tag\">Campaign · Multi-Day · Cinematic<\u002Fdiv>\n        <div class=\"proj-name\">Velvet Velocity Rally Campaign<\u002Fdiv>\n        <div class=\"proj-detail\">Full campaign ownership across multiple editions, scripted in commercial film style. Multi-day shoots across UAE roads and Fujairah mountain terrain, personally color-graded, and delivered as a full ecosystem — hero film, reels, teasers, and social.<\u002Fdiv>\n        <div class=\"proj-meta\"><span class=\"pmeta\">Multi-edition<\u002Fspan><span class=\"pmeta\">10+ deliverables<\u002Fspan><span class=\"pmeta\">Metrics tracked<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"proj-card\">\n        <div class=\"proj-tag\">Multi-Day Expeditions · Action · Logistics<\u002Fdiv>\n        <div class=\"proj-name\">Supercar Rallies &amp; Desert Experiences<\u002Fdiv>\n        <div class=\"proj-detail\">Led media and partner teams across multi-day supercar rallies and desert off-road expeditions. Managed convoy, permits, safety, and shot sequencing under pressure — capturing action, environment, and experience within a single production day.<\u002Fdiv>\n        <div class=\"proj-meta\"><span class=\"pmeta\">Multi-day<\u002Fspan><span class=\"pmeta\">Full team led<\u002Fspan><span class=\"pmeta\">Action + cinematic<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"proj-card\">\n        <div class=\"proj-tag\">Hospitality · Series · Marine Logistics<\u002Fdiv>\n        <div class=\"proj-name\">Yacht Experience &amp; Hospitality<\u002Fdiv>\n        <div class=\"proj-detail\">Ongoing content series across Beno's yacht fleet and waterfront. Planned around marine timing and access, blending cinematic hero sequences with experiential storytelling. Multi-format packages delivered for social, website, and booking channels.<\u002Fdiv>\n        <div class=\"proj-meta\"><span class=\"pmeta\">Multiple vessels<\u002Fspan><span class=\"pmeta\">Full team led<\u002Fspan><span class=\"pmeta\">Multi-format<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"proj-card\">\n        <div class=\"proj-tag\">Long-Form · Studio · Full Crew Direction<\u002Fdiv>\n        <div class=\"proj-name\">Beno x WEB3 Podcast<\u002Fdiv>\n        <div class=\"proj-detail\">Director and producer of a full broadcast podcast at Real Engine Technology Studios. Led a 10-person crew across a multi-cam 4K setup, guiding hosts on structure and delivery. Output: a 30–40min episode, BTS series, social clips, and photography sets.<\u002Fdiv>\n        <div class=\"proj-meta\"><span class=\"pmeta\">10-person crew<\u002Fspan><span class=\"pmeta\">Multi-cam studio<\u002Fspan><span class=\"pmeta\">5 deliverables<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"proj-card\">\n        <div class=\"proj-tag\">Brand Campaign · Actors · Full Production<\u002Fdiv>\n        <div class=\"proj-name\">Stajvelo Bicycle Brand Campaign<\u002Fdiv>\n        <div class=\"proj-detail\">Full creative and campaign production for a premium cycling brand — concept, script, and production design from scratch. Directed a cast of 10 actors with 5 crew and 5 ops across cycling routes, waterfront, and studio in a single production arc.<\u002Fdiv>\n        <div class=\"proj-meta\"><span class=\"pmeta\">10 actors · 5 crew · 5 ops<\u002Fspan><span class=\"pmeta\">Multi-location<\u002Fspan><span class=\"pmeta\">Brand campaign<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"proj-card\">\n        <div class=\"proj-tag\">Adventure · Action · Complex Logistics<\u002Fdiv>\n        <div class=\"proj-name\">Beno Desert Experience<\u002Fdiv>\n        <div class=\"proj-detail\">Full creative concept, script, and shoot design for large-scale desert productions. Led up to 12 actors, 6 crew, and 8 ops in remote terrain, running cinema line cameras, Insta360, GoPros, and drone in parallel. Wrapped on schedule with the full shot list secured.<\u002Fdiv>\n        <div class=\"proj-meta\"><span class=\"pmeta\">12 actors · 6 crew · 8 ops<\u002Fspan><span class=\"pmeta\">Cinema cameras · Insta360 · Drone<\u002Fspan><span class=\"pmeta\">Full safety planning<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"proj-card\">\n        <div class=\"proj-tag\">Docu-Series · Interviews · Human Stories<\u002Fdiv>\n        <div class=\"proj-name\">Beno Team Docu-Series<\u002Fdiv>\n        <div class=\"proj-detail\">Conceived and directed an ongoing documentary series about the people behind Beno, not just the assets. Wrote interview frameworks and cinematic setups to humanise the brand — giving its team a voice, a face, and a story.<\u002Fdiv>\n        <div class=\"proj-meta\"><span class=\"pmeta\">Scripted concepts<\u002Fspan><span class=\"pmeta\">Interview direction<\u002Fspan><span class=\"pmeta\">Ongoing series<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"proj-card\">\n        <div class=\"proj-tag\">Hero Films · Commercial Style · Script to Screen<\u002Fdiv>\n        <div class=\"proj-name\">Hero Campaigns Across Categories<\u002Fdiv>\n        <div class=\"proj-detail\">Scripted and shot-listed in commercial film style across categories, each with its own visual language and pacing. Directed every phase, concept to delivery — engineered for both brand elevation and direct conversion.<\u002Fdiv>\n        <div class=\"proj-meta\"><span class=\"pmeta\">Commercial approach<\u002Fspan><span class=\"pmeta\">Script to screen<\u002Fspan><span class=\"pmeta\">Multi-category<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"proj-card\">\n        <div class=\"proj-tag\">Social Strategy · Multi-Platform · KPI Targets<\u002Fdiv>\n        <div class=\"proj-name\">Social Media Coverage &amp; Metrics<\u002Fdiv>\n        <div class=\"proj-detail\">Designed and supervised a multi-platform social operation across Instagram, TikTok, LinkedIn, and YouTube. Defined formats, cadence, and per-platform targets, with shoots structured to capture multiple formats in a single day.<\u002Fdiv>\n        <div class=\"proj-meta\"><span class=\"pmeta\">4 platforms<\u002Fspan><span class=\"pmeta\">Multi-format per shoot<\u002Fspan><span class=\"pmeta\">KPI targets set<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- QUOTE -->\n<div class=\"quote-section\">\n  <div class=\"wrap\">\n    <div class=\"quote-inner reveal\">\n      <div class=\"quote-mark\">\"<\u002Fdiv>\n      <div>\n        <p class=\"quote-text\">Every project was approached as <em>a film, not content.<\u002Fem> The brief exists to protect the idea. The system exists to protect the quality.<\u002Fp>\n        <div class=\"quote-attr\">Bechara El Khoury · Creative Director · Head of Media · Beno, Dubai<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- SCALE -->\n<section id=\"scale\">\n  <div class=\"wrap\">\n    <div class=\"sec-head reveal\">\n      <p class=\"eyebrow\">Scale &amp; Output<\u002Fp>\n      <h2 class=\"sec-title\">Numbers that<br><span class=\"gold\">speak clearly.<\u002Fspan><\u002Fh2>\n    <\u002Fdiv>\n    <div class=\"metrics-grid reveal\">\n      <div class=\"metric-block accent\">\n        <div class=\"metric-big\"><span class=\"t\" data-count=\"107\">0<\u002Fspan><\u002Fdiv>\n        <div class=\"metric-title\">Productions delivered in under a year<\u002Fdiv>\n        <div class=\"metric-desc\">Shoots, edits, photo packages, campaigns, series, podcasts, brand films. Every content category covered. <b>All produced, directed, and supervised in-house<\u002Fb> with zero outsourced creative direction.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"metric-block\">\n        <div class=\"metric-big\"><span class=\"g\" data-count=\"28\">0<\u002Fspan><\u002Fdiv>\n        <div class=\"metric-title\">Shoots led as Head of Media, Director &amp; DOP<\u002Fdiv>\n        <div class=\"metric-desc\">Full-day, multi-day, night shoots, studio and field productions. <b>Dubai, Fujairah, Abu Dhabi, desert, waterfront, mountain terrain.<\u002Fb> Camera operator, director, and creative lead on every shoot.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"metric-block\">\n        <div class=\"metric-big\"><span class=\"g\" data-count=\"70\">0<\u002Fspan><span class=\"sfx g\">+<\u002Fspan><\u002Fdiv>\n        <div class=\"metric-title\">Video edits directed &amp; supervised to delivery<\u002Fdiv>\n        <div class=\"metric-desc\">Every edit reviewed through Frame.io with structured creative feedback. <b>Color grading, VO direction, music selection, sound design<\u002Fb> all personally supervised. 300+ total tracked hours on major productions alone.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"metric-block\">\n        <div class=\"metric-big\"><span class=\"t\" data-count=\"10\">0<\u002Fspan><\u002Fdiv>\n        <div class=\"metric-title\">Major campaigns owned end-to-end<\u002Fdiv>\n        <div class=\"metric-desc\">Velvet Velocity Rally, Cars &amp; Cigars, Beno Winners Cup, Stajvelo, Beno x WEB3 Podcast and more. <b>Each a complete production cycle<\u002Fb>: concept, script, shoot, post-production, stakeholder management, metrics review.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"viz-wrap reveal\">\n      <div class=\"viz-card\">\n        <div class=\"viz-head\">\n          <span class=\"viz-eyebrow\">Production mix<\u002Fspan>\n          <span class=\"viz-sub\">107 productions, grouped by world<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"donut-row\">\n          <svg class=\"donut\" viewBox=\"0 0 200 200\">\n            <g transform=\"rotate(-90 100 100)\">\n              <circle class=\"track\" cx=\"100\" cy=\"100\" r=\"80\"><\u002Fcircle>\n              <circle class=\"seg\" cx=\"100\" cy=\"100\" r=\"80\" stroke=\"#DCC089\" style=\"--da:124.4 378.3\" stroke-dashoffset=\"0\"><\u002Fcircle>\n              <circle class=\"seg\" cx=\"100\" cy=\"100\" r=\"80\" stroke=\"#00C2D4\" style=\"--da:114.5 388.2\" stroke-dashoffset=\"-124.4\"><\u002Fcircle>\n              <circle class=\"seg\" cx=\"100\" cy=\"100\" r=\"80\" stroke=\"#C2A06A\" style=\"--da:89.6 413.1\" stroke-dashoffset=\"-238.9\"><\u002Fcircle>\n              <circle class=\"seg\" cx=\"100\" cy=\"100\" r=\"80\" stroke=\"#0794B8\" style=\"--da:59.7 443.0\" stroke-dashoffset=\"-328 02Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"viz-card viz-bars\">\n        <div class=\"viz-head\">\n          <span class=\"viz-eyebrow\">By domain<\u002Fspan>\n          <span class=\"viz-sub\">Productions per content vertical<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"bars\">\n          <div class=\"bar-row hl\"><div class=\"bar-lbl\">Luxury Cars<\u002Fdiv><div class=\"bar-track\"><div class=\"bar-fill\" style=\"--w:100%\"><\u002Fdiv><\u002Fdiv><div class=\"bar-val\">15<\u002Fdiv><\u002Fdiv>\n          <div class=\"bar-row\"><div class=\"bar-lbl\">Yachts &amp; Marine<\u002Fdiv><div class=\"bar-track\"><div class=\"bar-fill\" style=\"--w:80%\"><\u002Fdiv><\u002Fdiv><div class=\"bar-val\">12<\u002Fdiv><\u002Fdiv>\n          <div class=\"bar-row\"><div class=\"bar-lbl\">Seasonal<\u002Fdiv><div class=\"bar-track\"><div class=\"bar-fill\" style=\"--w:80%\"><\u002Fdiv><\u002Fdiv><div class=\"bar-val\">12<\u002Fdiv><\u002Fdiv>\n          <div class=\"bar-row\"><div class=\"bar-lbl\">Rallies<\u002Fdiv><div class=\"bar-track\"><div class=\"bar-fill\" style=\"--w:67%\"><\u002Fdiv><\u002Fdiv><div class=\"bar-val\">10<\u002Fdiv><\u002Fdiv>\n          <div class=\"bar-row\"><div class=\"bar-lbl\">Luxury Events<\u002Fdiv><div class=\"bar-track\"><div class=\"bar-fill\" style=\"--w:67%\"><\u002Fdiv><\u002Fdiv><div class=\"bar-val\">10<\u002Fdiv><\u002Fdiv>\n          <div class=\"bar-row\"><div class=\"bar-lbl\">Collaborations<\u002Fdiv><div class=\"bar-track\"><div class=\"bar-fill\" style=\"--w:53%\"><\u002Fdiv><\u002Fdiv><div class=\"bar-val\">8<\u002Fdiv><\u002Fdiv>\n          <div class=\"bar-row\"><div class=\"bar-lbl\">Desert<\u002Fdiv><div class=\"bar-track\"><div class=\"bar-fill\" style=\"--w:53%\"><\u002Fdiv><\u002Fdiv><div class=\"bar-val\">8<\u002Fdiv><\u002Fdiv>\n          <div class=\"bar-row\"><div class=\"bar-lbl\">Brand &amp; Display<\u002Fdiv><div class=\"bar-track\"><div class=\"bar-fill\" style=\"--w:40%\"><\u002Fdiv><\u002Fdiv><div class=\"bar-val\">6<\u002Fdiv><\u002Fdiv>\n          <div class=\"bar-row\"><div class=\"bar-lbl\">Water Sports<\u002Fdiv><div class=\"bar-track\"><div class=\"bar-fill\" style=\"--w:40%\"><\u002Fdiv><\u002Fdiv><div class=\"bar-val\">6<\u002Fdiv><\u002Fdiv>\n          <div class=\"bar-row\"><div class=\"bar-lbl\">Hospitality<\u002Fdiv><div class=\"bar-track\"><div class=\"bar-fill\" style=\"--w:33%\"><\u002Fdiv><\u002Fdiv><div class=\"bar-val\">5<\u002Fdiv><\u002Fdiv>\n          <div class=\"bar-row\"><div class=\"bar-lbl\">Podcast<\u002Fdiv><div class=\"bar-track\"><div class=\"bar-fill\" style=\"--w:33%\"><\u002Fdiv><\u002Fdiv><div class=\"bar-val\">5<\u002Fdiv><\u002Fdiv>\n          <div class=\"bar-row\"><div class=\"bar-lbl\">Cycling<\u002Fdiv><div class=\"bar-track\"><div class=\"bar-fill\" style=\"--w:27%\"><\u002Fdiv><\u002Fdiv><div class=\"bar-val\">4<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- SYSTEMS -->\n<section id=\"systems\">\n  <div class=\"wrap\">\n    <div class=\"sec-head reveal\">\n      <p class=\"eyebrow\">Department Systems<\u002Fp>\n      <h2 class=\"sec-title\">Built to scale.<br><span class=\"gold\">From nothing.<\u002Fspan><\u002Fh2>\n      <p class=\"sec-intro\">Before December 2025, none of these systems existed. Every workflow, document, and process was identified, designed, and deployed in the first 90 days · without pausing production.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"ops-grid reveal\">\n      <div class=\"ops-card\">\n        <div class=\"ops-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\" rx=\"1.5\"><\u002Frect><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\" rx=\"1.5\"><\u002Frect><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\" rx=\"1.5\"><\u002Frect><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\" rx=\"1.5\"><\u002Frect><\u002Fsvg><\u002Fdiv>\n        <div class=\"ops-title\">Operating Infrastructure<\u002Fdiv>\n        <div class=\"ops-desc\">Full department built from zero. Every operational document designed and deployed within 30 days of founding.<\u002Fdiv>\n        <ul class=\"ops-list\"><li>Media Team Operating Manual v1.0<\u002Fli><li>Shoot Brief Intake Form<\u002Fli><li>Equipment Checkout &amp; Return System<\u002Fli><li>Post-Shoot Report Protocol<\u002Fli><li>Communication channel structure<\u002Fli><\u002Ful>\n      <\u002Fdiv>\n      <div class=\"ops-card\">\n        <div class=\"ops-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><circle cx=\"12\" cy=\"12\" r=\"3.2\"><\u002Fcircle><path d=\"M12 3v4M12 17v4M3 12h4M17 12h4\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <div class=\"ops-title\">Creative Control Systems<\u002Fdiv>\n        <div class=\"ops-desc\">Single-owner editing hierarchy. Structured review windows. Frame.io as the sole feedback channel. No parallel inputs.<\u002Fdiv>\n        <ul class=\"ops-list\"><li>Editing Review Hierarchy<\u002Fli><li>Frame.io review-only policy<\u002Fli><li>Editor brief format<\u002Fli><li>Visual identity framework v1<\u002Fli><li>LUT &amp; color direction guidelines<\u002Fli><\u002Ful>\n      <\u002Fdiv>\n      <div class=\"ops-card\">\n        <div class=\"ops-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 4v16h16\"><\u002Fpath><path d=\"M7.5 14.5l3.5-4 3 2.5L21 6.5\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <div class=\"ops-title\">Measurement &amp; Reporting<\u002Fdiv>\n        <div class=\"ops-desc\">First performance tracking system the department ever had. Weekly scores, monthly trends, quarterly OKRs. Ready for leadership reporting.<\u002Fdiv>\n        <ul class=\"ops-list\"><li>OKR Framework · 3 objectives / 12 KRs<\u002Fli><li>25+ KPI tracking dashboard<\u002Fli><li>Weekly operational scoreboard<\u002Fli><li>Phase-based department roadmap<\u002Fli><li>Monthly scorecard reports<\u002Fli><\u002Ful>\n      <\u002Fdiv>\n      <div class=\"ops-card\">\n        <div class=\"ops-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3.5\" y=\"4.5\" width=\"17\" height=\"16\" rx=\"2\"><\u002Frect><path d=\"M3.5 9h17M8 3v3M16 3v3\"><\u002Fpath><path d=\"M7.5 13l1.7 1.7L12 12\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <div class=\"ops-title\">Production Planning<\u002Fdiv>\n        <div class=\"ops-desc\">Timelines, workload references, and capacity planning that made delivery expectations visible and defensible to leadership.<\u002Fdiv>\n        <ul class=\"ops-list\"><li>Production Timelines Reference doc<\u002Fli><li>Trello-based project tracking<\u002Fli><li>Shot list &amp; call sheet system<\u002Fli><li>107-project Master Production Log<\u002Fli><li>Content category framework (8 types)<\u002Fli><\u002Ful>\n      <\u002Fdiv>\n      <div class=\"ops-card\">\n        <div class=\"ops-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"9\" cy=\"8\" r=\"3.2\"><\u002Fcircle><path d=\"M3.5 19a5.5 5.5 0 0 1 11 0\"><\u002Fpath><circle cx=\"17\" cy=\"9\" r=\"2.4\"><\u002Fcircle><path d=\"M15 13.5a4.5 4.5 0 0 1 5.5 4.5\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <div class=\"ops-title\">Talent &amp; Team<\u002Fdiv>\n        <div class=\"ops-desc\">Built hiring criteria, screening processes, and onboarding systems for all media roles. Team grew from 1 to 7 at peak.<\u002Fdiv>\n        <ul class=\"ops-list\"><li>Editor screening &amp; onboarding (3 hires)<\u002Fli><li>Videographer role definition<\u002Fli><li>SMM &amp; Photographer JDs<\u002Fli><li>On-set role clarity framework<\u002Fli><li>Shooting guidelines &amp; dress code<\u002Fli><\u002Ful>\n      <\u002Fdiv>\n      <div class=\"ops-card\">\n        <div class=\"ops-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M15.5 8.5l-2 5-5 2 2-5z\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <div class=\"ops-title\">Strategy &amp; Vision<\u002Fdiv>\n        <div class=\"ops-desc\">3-phase roadmap from Foundation to Scale to Full Creative Capability. Content strategy and visual identity designed for long-term brand equity.<\u002Fdiv>\n        <ul class=\"ops-list\"><li>3-Phase dept development roadmap<\u002Fli><li>8 content category framework<\u002Fli><li>AI integration planning<\u002Fli><li>Brand manifesto creation<\u002Fli><\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- APPROACH -->\n<section>\n  <div class=\"wrap\">\n    <div class=\"sec-head reveal\">\n      <p class=\"eyebrow\">Creative Philosophy<\u002Fp>\n      <h2 class=\"sec-title\">The approach behind<br><span class=\"gold\">every production.<\u002Fspan><\u002Fh2>\n    <\u002Fdiv>\n    <div class=\"approach-grid reveal\">\n      <div class=\"approach-card\">\n        <div class=\"approach-num\">01<\u002Fdiv>\n        <div class=\"approach-title\">Direction over execution<\u002Fdiv>\n        <div class=\"approach-desc\">Every production starts with a clear intention · a feeling, a message, a visual idea. <em>The brief exists to protect the concept.<\u002Fem> Execution without direction is just content. Direction with structure is filmmaking · regardless of the format length.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"approach-card\">\n        <div class=\"approach-num\">02<\u002Fdiv>\n        <div class=\"approach-title\">Cinematic standard across formats<\u002Fdiv>\n        <div class=\"approach-desc\">Whether it's a 7-second Instagram Story or a 40-minute podcast · the same principles apply. <em>Pacing. Composition. Light. Sound.<\u002Fem> The format changes. The care doesn't. Luxury content demands cinematic thinking, not just fast delivery.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"approach-card\">\n        <div class=\"approach-num\">03<\u002Fdiv>\n        <div class=\"approach-title\">Structure enables creativity<\u002Fdiv>\n        <div class=\"approach-desc\">Systems aren't bureaucracy · they're the conditions for better work. <em>A clear brief means the editor isn't guessing. A review window means the creative director isn't firefighting.<\u002Fem> Every system built at Beno existed to free the team to focus on quality.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"approach-card\">\n        <div class=\"approach-num\">04<\u002Fdiv>\n        <div class=\"approach-title\">Unity of standard<\u002Fdiv>\n        <div class=\"approach-desc\">Cars at midnight. Yachts at golden hour. Buggies in the dunes. Bikes on the waterfront. Podcast in a studio. Each world has its own visual language · <em>the head of media's job is to understand all of them<\u002Fem> and hold them to the same standard.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- FOOTER -->\n<footer id=\"contact\">\n  <div class=\"wrap\">\n    <div class=\"footer-line\"><\u002Fdiv>\n    <div class=\"footer-inner\">\n      <div>\n        <div class=\"footer-name\">Bechara <span>El Khoury<\u002Fspan><\u002Fdiv>\n        <div class=\"footer-role\">Head of Media · Creative Director · Cinematographer<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"footer-meta\">\n        <p><strong>Based in:<\u002Fstrong> Dubai, UAE<\u002Fp>\n        <p><strong>Experience:<\u002Fstrong> 16+ years · 30+ countries<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<script>\n(function(){\n  var prog = document.querySelector('.scroll-prog');\n  function onScroll(){\n    var h = document.documentElement;\n    var max = h.scrollHeight - h.clientHeight;\n    prog.style.transform = 'scaleX(' + (max > 0 ? h.scrollTop / max : 0) + ')';\n  }\n  window.addEventListener('scroll', onScroll, { passive: true });\n  onScroll();\n\n  function animCount(el){\n    var target = parseFloat(el.dataset.count), dur = 1500, start = performance.now();\n    function tick(now){\n      var t = Math.min((now - start) / dur, 1);\n      var e = 1 - Math.pow(1 - t, 3);\n      el.textContent = Math.round(target * e).toLocaleString();\n      if (t < 1) requestAnimationFrame(tick);\n      else el.textContent = target.toLocaleString();\n    }\n    requestAnimationFrame(tick);\n  }\n  var countIO = new IntersectionObserver(function(entries){\n    entries.forEach(function(en){\n      if (en.isIntersecting){ if (en.target.dataset.count) animCount(en.target); countIO.unobserve(en.target); }\n    });\n  }, { threshold: 0.6 });\n  document.querySelectorAll('[data-count]').forEach(function(el){ countIO.observe(el); });\n\n  var revealIO = new IntersectionObserver(function(entries){\n    entries.forEach(function(en){ if (en.isIntersecting){ en.target.classList.add('in'); revealIO.unobserve(en.target); } });\n  }, { threshold: 0.12 });\n  document.querySelectorAll('.reveal, .viz-bars, .donut-row').forEach(function(el){ revealIO.observe(el); });\n\n  // Reel rail horizontal scroll\n  window.scrollReel = function(dir){\n    var rail = document.getElementById('reelRail');\n    var card = rail.querySelector('.reel-card');\n    var step = card ? card.offsetWidth + 22 : 290;\n    rail.scrollBy({ left: dir * step, behavior: 'smooth' });\n  };\n})();\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
